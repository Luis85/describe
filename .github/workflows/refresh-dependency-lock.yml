name: Resolve reviewed dependency batch
on:
  push:
    branches: [chore/dependency-maintenance]
    paths: [scripts/refresh-dependency-lock.mjs]
permissions:
  contents: write
concurrency:
  group: describe-dependency-lock
  cancel-in-progress: true
jobs:
  lock:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node scripts/refresh-dependency-lock.mjs
