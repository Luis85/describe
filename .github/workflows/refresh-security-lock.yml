name: Patch native test dependencies
on:
  push:
    branches: [feat/describe-plugin]
    paths: [scripts/refresh-security-lock.mjs]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node scripts/refresh-security-lock.mjs
      - run: npm ci
      - run: npm run check
      - run: node scripts/audit.mjs
        if: always()
