name: Verify compatible native runner
on:
  push:
    branches: [feat/describe-plugin]
    paths: [scripts/refresh-adapter-lock.mjs]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node scripts/refresh-adapter-lock.mjs
      - run: npm ci
      - run: npm run check
      - run: node scripts/audit.mjs
      - run: sudo apt-get update -q && sudo apt-get install -y xvfb herbstluftwm x11-xserver-utils libnss3 libasound2t64 libgbm1
      - run: xvfb-run -a --server-args='-screen 0 1280x1024x24' sh -c 'herbstluftwm & npm run test:e2e'
        env:
          OBSIDIAN_VERSION: '1.13.7'
          OBSIDIAN_UI: desktop
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compatible-native-runner
          path: |
            reports/native/
            coverage/
            dist/
          if-no-files-found: warn
