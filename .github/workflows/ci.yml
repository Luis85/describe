name: Quality and package verification
on:
  push:
    branches: [main, feat/describe-plugin]
  pull_request:
permissions:
  contents: read
concurrency:
  group: describe-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test-build
      - run: node scripts/audit.mjs
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: describe-verification
          path: |
            coverage/
            dist/
          if-no-files-found: error
