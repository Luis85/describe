name: Resolve Vitest native migration lock
on:
  push:
    branches: [test/vitest-native-acceptance]
    paths: [scripts/refresh-vitest-lock.mjs]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node scripts/refresh-vitest-lock.mjs
