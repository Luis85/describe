name: Resolve reviewed Node baseline
on:
  push:
    branches: [chore/post-vitest-dependencies]
    paths: [scripts/refresh-baseline-lock.mjs]
permissions:
  contents: write
concurrency:
  group: describe-baseline-lock
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node scripts/refresh-baseline-lock.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: resolved-baseline-manifests
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
