name: One-time security dependency refresh
on:
  push:
    branches: [feat/describe-plugin]
    paths: [scripts/refresh-lock.mjs]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/refresh-lock.mjs
      - run: npm ci
      - run: npm run check
      - run: npm run test-build
      - run: node scripts/audit.mjs
