name: Prepare release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Next x.y.z version. Write the Unreleased changelog first.'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: describe-release-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Prepare a reviewable version PR without tagging or publishing
        run: node scripts/prepare-release-pr.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
