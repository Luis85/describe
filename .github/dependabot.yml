version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      native-testing:
        patterns: ['@wdio/*', 'webdriverio', 'wdio-obsidian-*', 'mocha', '@types/mocha', '@axe-core/*']
      vitest:
        patterns: ['vitest', '@vitest/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
