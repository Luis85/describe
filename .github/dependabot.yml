version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      vitest:
        patterns: ['vitest', '@vitest/*']
      native-testing:
        patterns: ['webdriverio', 'wdio-obsidian-service', '@axe-core/*']
        update-types: [minor, patch]
      development-tooling:
        dependency-type: development
        patterns: ['*']
        exclude-patterns: ['vitest', '@vitest/*', 'webdriverio', 'wdio-obsidian-service', '@axe-core/*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-compatible:
        patterns: ['*']
        update-types: [minor, patch]
